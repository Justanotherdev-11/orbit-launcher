<!doctype html>
<html lang="en" data-accent="cyan">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit Launcher</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="bg"><div class="bg-dots"></div></div>

    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M1 1h13l5 5v13H6l-5-5z" stroke="currentColor" stroke-width="2" />
          <rect x="7" y="7" width="6" height="6" fill="currentColor" />
        </svg>
        <span class="brand-name" data-tauri-drag-region>ORBIT</span>
      </div>
      <div class="title-center" id="title-status" data-tauri-drag-region></div>
      <div class="title-right">
        <span class="title-clock" id="clock" hidden></span>
        <button class="palette-btn" id="palette-btn" title="Command palette">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <span>Search</span><span class="kbd">Ctrl K</span>
        </button>
        <button class="account-chip" id="account-chip" title="Accounts"></button>
        <div class="win-controls">
          <button id="win-min" title="Minimize"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2" /></svg></button>
          <button id="win-max" title="Maximize"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2" /></svg></button>
          <button id="win-close" class="close" title="Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2" /></svg></button>
        </div>
      </div>
    </header>

    <nav class="rail" id="rail"></nav>
    <main class="view" id="view"></main>

    <div class="drop-overlay" id="drop-overlay">
      <div class="box"><div class="glyph" id="drop-glyph"></div><h3 id="drop-title">Drop to add</h3><div class="muted" id="drop-sub"></div></div>
    </div>
    <div class="tasks" id="tasks"></div>
    <div class="toasts" id="toasts"></div>
    <div id="overlays"></div>
  </body>
</html>
